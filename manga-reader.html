<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漫画连载 · 壹碗碗</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #f5f2ee; --ink: #1a1a1a; --soft: #e8e3dc; --accent: #c85a3a; --muted: #9a8f85; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: 'Noto Serif SC', serif; display: flex; flex-direction: column; align-items: center; }
  header { width: 100%; max-width: 480px; padding: 1rem 1.5rem 0.5rem; display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--ink); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ink); text-decoration: none; font-size: 18px; transition: background 0.2s; flex-shrink: 0; }
  .back-btn:hover { background: var(--soft); }
  .title-block { flex: 1; }
  .title-block h1 { font-size: 1rem; font-weight: 600; letter-spacing: 0.05em; }
  .title-block p { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .page-counter { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .reader { width: 100%; max-width: 480px; flex: 1; position: relative; padding: 0 1rem; min-height: 0; }
  .comic-viewport { width: 100%; height: 100%; overflow: hidden; border-radius: 8px; background: white; box-shadow: 0 4px 24px rgba(0,0,0,0.08); position: relative; touch-action: pan-y; }
  .comic-track { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1); will-change: transform; }
  .comic-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .comic-slide img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .side-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 64px; border: none; border-radius: 8px; background: rgba(255,255,255,0.85); backdrop-filter: blur(4px); box-shadow: 0 2px 12px rgba(0,0,0,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--ink); transition: background 0.15s, opacity 0.15s, transform 0.15s; z-index: 10; }
  .side-btn:hover { background: white; transform: translateY(-50%) scale(1.05); }
  .side-btn:disabled { opacity: 0.15; cursor: not-allowed; }
  .side-btn:disabled:hover { transform: translateY(-50%) scale(1); }
  .side-btn.left { left: -4px; }
  .side-btn.right { right: -4px; }
  .progress-wrap { width: 100%; max-width: 480px; padding: 0.6rem 1rem 0.4rem; flex-shrink: 0; }
  .progress-bar { width: 100%; height: 2px; background: var(--soft); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .dot-nav { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 480px; padding: 0.3rem 1rem 0.8rem; flex-shrink: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--soft); cursor: pointer; transition: background 0.2s, transform 0.2s; border: none; padding: 0; }
  .dot.active { background: var(--accent); transform: scale(1.3); }
</style>
</head>
<body>
<header>
  <a class="back-btn" onclick="window.top.location.href='https://yvonneh10000.framer.website/yiwanwan'">←</a>
  <div class="title-block"><h1>漫画连载</h1><p>壹碗碗 · 个人作品</p></div>
  <span class="page-counter" id="counter">1 / 30</span>
</header>
<div class="reader">
  <div class="comic-viewport" id="viewport">
    <div class="comic-track" id="track"></div>
  </div>
  <button class="side-btn left" id="prevBtn" disabled>‹</button>
  <button class="side-btn right" id="nextBtn">›</button>
</div>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:3.33%"></div></div>
</div>
<div class="dot-nav" id="dotNav"></div>
<script>
  const images = ['1.webp','2.webp','3.webp','4.webp','5.webp','6.webp','7.webp','8.webp','9.webp','10.webp','11.webp','12.webp','13.webp','14.webp','15.webp','16.webp','17.webp','18.webp','19.webp','20.webp','21.webp','22.webp','23.webp','24.webp','25.webp','26.webp','27.webp','28.webp','29.webp','30.webp'];
  const track = document.getElementById('track');
  const dotNav = document.getElementById('dotNav');
  const counter = document.getElementById('counter');
  const progressFill = document.getElementById('progressFill');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  let current = 0;
  images.forEach((src, i) => {
    const slide = document.createElement('div'); slide.className = 'comic-slide';
    const img = document.createElement('img'); img.src = src; img.alt = `第${i+1}话`; img.loading = i < 3 ? 'eager' : 'lazy';
    slide.appendChild(img); track.appendChild(slide);
    const dot = document.createElement('button'); dot.className = 'dot' + (i === 0 ? ' active' : ''); dot.setAttribute('aria-label', `第${i+1}页`); dot.addEventListener('click', () => goTo(i)); dotNav.appendChild(dot);
  });
  function goTo(idx) {
    if (idx < 0 || idx >= images.length) return;
    current = idx;
    track.style.transform = `translateX(-${current * 100}%)`;
    counter.textContent = `${current + 1} / ${images.length}`;
    progressFill.style.width = `${((current + 1) / images.length) * 100}%`;
    prevBtn.disabled = current === 0; nextBtn.disabled = current === images.length - 1;
    document.querySelectorAll('.dot').forEach((d, i) => { d.className = 'dot' + (i === current ? ' active' : ''); });
  }
  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));
  document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') goTo(current + 1); if (e.key === 'ArrowLeft') goTo(current - 1); });
  let touchStartX = 0;
  const vp = document.getElementById('viewport');
  vp.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
  vp.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - touchStartX; if (dx < -40) goTo(current + 1); if (dx > 40) goTo(current - 1); }, {passive: true});
</script>
</body>
</html>
